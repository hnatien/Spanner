name: Spanner
options:
  bundleIdPrefix: dev.spanner
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  SpannerKit:
    path: Packages/SpannerKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Spanner:
    type: application
    platform: macOS
    sources:
      - path: Spanner
    info:
      path: Spanner/Resources/Info.plist
      properties:
        CFBundleDisplayName: Spanner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        NSAudioCaptureUsageDescription: Spanner's volume mixer adjusts the level of individual apps. Audio goes straight to your speakers and is never recorded.
        # Sparkle stays dormant until a signed appcast exists (see docs).
        SUFeedURL: ""
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: false
    entitlements:
      path: Spanner/Resources/Spanner.entitlements
      properties:
        com.apple.security.app-sandbox: false
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spanner.Spanner
        PRODUCT_NAME: Spanner
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Sparkle
      - package: SpannerKit
        product: SpannerCore
      - package: SpannerKit
        product: CSMC
